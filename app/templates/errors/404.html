{% extends "base.html" %}

{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-12 col-md-6 text-center">
    <div class="display-1 fw-bold text-forest mb-2">404</div>
    <h3 class="fw-bold mb-3">Record or Page Not Found</h3>
    <p class="text-muted mb-4">{{ message or "The villa, member record, or page you were attempting to access does not exist in the community database." }}</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-forest">
      <i class="bi bi-house-door me-1"></i> Return to Dashboard
    </a>
  </div>
</div>
{% endblock %}
